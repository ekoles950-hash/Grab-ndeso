<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basecamp Coffee - Monitoring Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; }
        .table-container { background-color: #1E293B; border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter">BASECAMP COFFEE <span class="text-white">| MONITORING TOP UP</span></h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Sengkuni Net & PT FAMILI - Khusus Transaksi Saldo</p>
            </div>
            <div class="flex gap-2">
                <button onclick="risetDatabaseLama()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-5 py-3 rounded-xl uppercase tracking-wider transition-all active:scale-95 shadow-lg">
                    🗑️ Riset Data Sukses
                </button>
                <button onclick="loadTransaksi()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-5 py-3 rounded-xl uppercase tracking-wider transition-all active:scale-95 shadow-lg">
                    🔄 Refresh Data
                </button>
            </div>
        </div>

        <div class="table-container rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 bg-[#1e2e4a]">
                <h2 class="font-extrabold text-sm uppercase tracking-wider text-blue-400">Antrean Saldo & Pulsa Masuk</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-[10px] uppercase tracking-widest text-slate-400 bg-slate-900/50">
                            <th class="p-4">Waktu</th>
                            <th class="p-4">Nama Produk</th>
                            <th class="p-4">SKU Code</th>
                            <th class="p-4">No HP Tujuan</th>
                            <th class="p-4">Harga Jual</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body" class="text-sm font-semibold divide-y divide-slate-800">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-500 animate-pulse">Memuat data transaksi saldo...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://butydxuauhtvwojvpixt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yO2CBmW5iJ8UKXw802hvXA_nAz3gr9X';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TELE_TOKEN = '8854342299:AAF3dBZvDDItaPS08hhYI_-0Q4ccm-dKgPs';
        const TELE_CHAT_ID = '8498622906'; 

        document.addEventListener("DOMContentLoaded", loadTransaksi);

        async function loadTransaksi() {
            const tbody = document.getElementById('tabel-body');
            const { data, error } = await sb
                .from('pesanan_pulsa')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(40);

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-400">Gagal memuat: ${error.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">Belum ada transaksi saldo masuk.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(trx => {
                const waktu = new Date(trx.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                let badgeColor = 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20';
                if (trx.status === 'success') badgeColor = 'bg-green-500/10 text-green-400 border border-green-500/20';

                const row = `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="p-4 text-slate-400 text-xs">${waktu} WIB</td>
                        <td class="p-4 font-bold text-white">${trx.nama_produk}</td>
                        <td class="p-4 font-mono text-xs text-blue-400">${trx.sku_code}</td>
                        <td class="p-4 font-mono tracking-wider text-slate-300">${trx.nomor_tujuan}</td>
                        <td class="p-4 text-emerald-400">Rp ${parseInt(trx.harga_jual).toLocaleString('id-ID')}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ${badgeColor}">
                                ${trx.status}
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            ${trx.status === 'pending' ? `
                                <button onclick="prosesTransaksi('${trx.id}', '${trx.nomor_tujuan}', '${trx.nama_produk}')" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-lg uppercase tracking-wide transition-all shadow-lg active:scale-95">
                                    ✅ Kirim Saldo
                                </button>
                            ` : `<span class="text-slate-500 text-xs font-normal">Selesai Berhasil</span>`}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        async function prosesTransaksi(id, noTujuan, namaProduk) {
            if (!confirm(`Eksekusi pengiriman saldo ke nomor ${noTujuan}?`)) return;

            const { error } = await sb
                .from('pesanan_pulsa')
                .update({ status: 'success' })
                .eq('id', id);

            if (error) {
                alert("Gagal proses: " + error.message);
                return;
            }

            const pesanSukses = `✅ *TOP UP BERHASIL (SUCCESS)* ✅\n\n📦 *Produk:* ${namaProduk}\n🎯 *Tujuan:* ${noTujuan}\n⚡ *Status:* LUNAS / PROSED`;
            const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${TELE_CHAT_ID}&text=${encodeURIComponent(pesanSukses)}&parse_mode=Markdown`;
            fetch(url, { mode: 'no-cors' }).then(() => {
                loadTransaksi();
            });
        }

        // FUNGSI RISET DATABASE KHUSUS KONTROL ADMIN MAS EKO
        async function risetDatabaseLama() {
            if (!confirm("⚠️ PERINGATAN KASIR!\n\nApakah Mas Eko yakin mau menghapus semua data transaksi 'SUCCESS' yang numpuk di database Supabase? Data lama akan dibersihkan total!")) return;

            // Hapus semua baris yang statusnya sudah 'success' agar Supabase kosong & ringan kembali
            const { error } = await sb
                .from('pesanan_pulsa')
                .delete()
                .eq('status', 'success');

            if (error) {
                alert("Gagal meriset data: " + error.message);
            } else {
                alert("🎉 Sukses! Database dibersihkan total, transaksi aman ter-reset!");
                loadTransaksi();
            }
        }
    </script>
</body>
</html>
